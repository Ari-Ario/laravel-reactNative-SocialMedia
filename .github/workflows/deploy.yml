name: Deploy to Forge

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Forge Deployment
        run: |
          if [ -z "${{ secrets.FORGE_DEPLOYMENT_TRIGGER_URL }}" ]; then
            echo "⚠️ FORGE_DEPLOYMENT_TRIGGER_URL secret is not set in GitHub Settings > Secrets."
            echo "If you have Quick Deploy enabled on Laravel Forge, this is expected and the deployment will still happen automatically."
            exit 0
          fi
          
          echo "🚀 Triggering deployment on Laravel Forge..."
          curl -fsSL "${{ secrets.FORGE_DEPLOYMENT_TRIGGER_URL }}"
          echo "✅ Deployment trigger sent successfully."
